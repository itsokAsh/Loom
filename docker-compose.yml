services:
  postgres:
    image: postgres:16-alpine
    container_name: workflow_postgres
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      # The default DB. We create trigger_db and orchestration_db via the init script.
      POSTGRES_DB: postgres 
    ports:
      - "5440:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: workflow_rabbitmq
    ports:
      - "5672:5672"   # AMQP protocol port
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: workflow_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  trigger-migrations:
    image: migrate/migrate
    container_name: workflow_trigger_migrations
    volumes:
      - ./trigger-api/migrations:/migrations
    command: ["-path", "/migrations", "-database", "postgres://postgres:postgres_password@postgres:5432/trigger_db?sslmode=disable", "up"]
    depends_on:
      postgres:
        condition: service_healthy

  orchestration-migrations:
    image: migrate/migrate
    container_name: workflow_orchestration_migrations
    volumes:
      - ./orchestration-engine/migrations:/migrations
    command: ["-path", "/migrations", "-database", "postgres://postgres:postgres_password@postgres:5432/orchestration_db?sslmode=disable", "up"]
    depends_on:
      postgres:
        condition: service_healthy

  worker-migrations:
    image: migrate/migrate
    container_name: workflow_worker_migrations
    volumes:
      - ./node-worker-pool/migrations:/migrations
    command: ["-path", "/migrations", "-database", "postgres://postgres:postgres_password@postgres:5432/worker_db?sslmode=disable", "up"]
    depends_on:
      postgres:
        condition: service_healthy

  trigger-api:
    build:
      context: .
      dockerfile: trigger-api/Dockerfile
    container_name: workflow_trigger
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgres://postgres:postgres_password@postgres:5432/trigger_db?sslmode=disable"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      ORCHESTRATION_URL: "http://orchestration-engine:8081"
      ADMIN_API_KEY: "${ADMIN_API_KEY:-dev-admin-key}"
      TRIGGER_PUBLIC_URL: "${TRIGGER_PUBLIC_URL:-http://localhost:3000/v1}"
      CREDENTIALS_ENCRYPTION_KEY: "${CREDENTIALS_ENCRYPTION_KEY:-loom-dev-credentials-key-change-me}"
      SERVICE_TOKEN: "${SERVICE_TOKEN:-loom-dev-service-token}"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      trigger-migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  orchestration-engine:
    build:
      context: .
      dockerfile: orchestration-engine/Dockerfile
    container_name: workflow_orchestration
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: "postgres://postgres:postgres_password@postgres:5432/orchestration_db?sslmode=disable"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      orchestration-migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  node-worker-pool:
    build:
      context: .
      dockerfile: node-worker-pool/Dockerfile
    container_name: workflow_worker_pool
    environment:
      DATABASE_URL: "postgres://postgres:postgres_password@postgres:5432/worker_db?sslmode=disable"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      SENDGRID_API_KEY: "${SENDGRID_API_KEY}"
      TRIGGER_API_URL: "http://trigger-api:8080"
      SERVICE_TOKEN: "${SERVICE_TOKEN:-loom-dev-service-token}"
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      worker-migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "${VITE_API_URL:-/v1}"
        VITE_ADMIN_API_KEY: "${ADMIN_API_KEY:-dev-admin-key}"
        VITE_WEBHOOK_BASE: "${VITE_WEBHOOK_BASE:-/v1/webhooks}"
    container_name: workflow_ui
    ports:
      - "3000:80"
    depends_on:
      trigger-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
