# Render Blueprint for Loom
# Docs: https://render.com/docs/blueprint-spec
# Deploy: Render Dashboard → New → Blueprint → connect this repo

databases:
  - name: loom-postgres
    databaseName: trigger_db
    plan: free
    user: loom

services:
  # --- Public API (workflows, webhooks, schedules) ---
  - type: web
    name: loom-api
    runtime: docker
    dockerfilePath: ./trigger-api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: loom-postgres
          property: connectionString
      - key: RABBITMQ_URL
        sync: false
      - key: ADMIN_API_KEY
        generateValue: true
      - key: SERVICE_TOKEN
        generateValue: true
      - key: CREDENTIALS_ENCRYPTION_KEY
        generateValue: true
      - key: TRIGGER_PUBLIC_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Free web services cannot RECEIVE private-network traffic.
      # Set this to the public HTTPS URL of loom-orchestration, e.g.
      # https://loom-orchestration-xxxx.onrender.com
      - key: ORCHESTRATION_URL
        sync: false

  # --- Orchestration (DAG engine + execution API) ---
  - type: web
    name: loom-orchestration
    runtime: docker
    dockerfilePath: ./orchestration-engine/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: loom-postgres
          property: connectionString
      - key: DATABASE_NAME
        value: orchestration_db
      - key: RABBITMQ_URL
        sync: false

  # --- Node worker (HTTP, email, transform). type: web on free plan (workers need paid).
  - type: web
    name: loom-worker
    runtime: docker
    dockerfilePath: ./node-worker-pool/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: loom-postgres
          property: connectionString
      - key: DATABASE_NAME
        value: worker_db
      - key: RABBITMQ_URL
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: TRIGGER_API_HOSTPORT
        fromService:
          type: web
          name: loom-api
          property: hostport
      - key: SERVICE_TOKEN
        fromService:
          type: web
          name: loom-api
          envVarKey: SERVICE_TOKEN

  # --- Static UI (optional on Render; use Vercel instead if you prefer) ---
  - type: web
    name: loom-ui
    runtime: static
    buildCommand: cd ui && npm ci && npm run build
    staticPublishPath: ui/dist
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /v1/*
        destination: https://loom-api.onrender.com/v1/*
    envVars:
      - key: VITE_API_URL
        value: /v1
      - key: VITE_WEBHOOK_BASE
        value: /v1/webhooks
      - key: VITE_ADMIN_API_KEY
        fromService:
          type: web
          name: loom-api
          envVarKey: ADMIN_API_KEY
